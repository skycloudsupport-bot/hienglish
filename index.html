{id:"tech",t:"Teaching technique",s:"Show, explain, correct",i:["Kick from your hips, not your knees.|اضرب بالقدمين من الوركين وليس الركبتين.","Keep your head down and look at the bottom.|ابقَ رأسك للأسفل وانظر إلى القاع.","Stretch your arm forward.|مدّ ذراعك للأمام.","Keep your legs straight.|أبقِ ساقيك مستقيمتين.","Breathe out in the water, breathe in on the side.|ازفر في الماء وخذ نفساً من الجانب.","Let me show you.|دعني أريك.","Watch me, then try.|شاهدني ثم جرّب.","Good, but try to relax your shoulders.|جيد، لكن حاول أن ترخي كتفيك.","Not like this, like this.|ليس هكذا، بل هكذا.","Try it one more time.|جرّب مرة أخرى."]},
{id:"work",t:"Giving workouts",s:"Sets, rests and signals",i:["Swim four lengths of freestyle.|اسبح أربعة أطوال حرة.","We will do three sets of four.|سنقوم بثلاث مجموعات من أربعة.","Rest for twenty seconds.|استرح عشرين ثانية.","Start on my signal.|ابدأ عند إشارتي.","Use the kickboard for this set.|استخدم لوح الطفو في هذه المجموعة.","Go easy, then go fast.|ابدأ بهدوء ثم أسرع.","Hold on to the wall.|أمسك بحافة المسبح.|kids","Stay on the right side of the lane.|ابقَ على الجانب الأيمن من الحارة.","Count your strokes.|عدّ ضرباتك.|pro","Last one, give it everything!|آخر واحدة، أعطها كل ما لديك!|pro"]},
{id:"care",t:"Safety and health checks",s:"Asking and warning",i:["Are you okay?|هل أنت بخير؟","Does it hurt? Where?|هل يؤلمك؟ أين؟","Do you feel dizzy or tired?|هل تشعر بدوخة أو تعب؟","Get out of the pool slowly.|اخرج من المسبح ببطء.","Take a break and drink some water.|خذ استراحة واشرب بعض الماء.","Walk, don't run.|امشِ ولا تجرِ.|kids","Never swim alone.|لا تسبح وحدك أبداً.","Tell me if you feel any pain.|أخبرني إن شعرت بأي ألم."]},
{id:"par",t:"Parents and clients",s:"Professional and polite",i:["Welcome! Nice to meet you.|أهلاً بك! سعيد بلقائك.","Your child is making great progress.|طفلك يحرز تقدماً رائعاً.","The lesson is forty-five minutes.|مدة الحصة خمسة وأربعون دقيقة.","Please bring a swim cap and goggles.|من فضلك أحضر قبعة ونظارة سباحة.","We have classes on Sunday and Tuesday.|لدينا حصص يوم الأحد والثلاثاء.","He needs more practice at home.|يحتاج إلى مزيد من التمرين.","Please tell me if he has any health issues.|من فضلك أخبرني إن كانت لديه مشاكل صحية.","Could you pay at the start of the month?|هل يمكنك الدفع في بداية الشهر؟|adults"]},
{id:"mot",t:"Motivating",s:"Keep them going",i:["Well done!|أحسنت!","Great job today!|عمل رائع اليوم!","You are getting better every day.|تتحسن كل يوم.","Don't give up, you can do it!|لا تستسلم، تستطيع فعلها!","That was much better.|كان ذلك أفضل بكثير.","Don't be afraid, I'm here.|لا تخف، أنا هنا.|kids","Be proud of yourself.|كن فخوراً بنفسك.","Almost there, keep going!|اقتربت، واصل!"]},
{id:"start",t:"Starting and ending the lesson",s:"Lining up and instructions",i:["Line up at the wall, please.|اصطفوا عند الحائط من فضلكم.", "Let's get in the water.|لندخل إلى الماء.", "Sit on the edge of the pool.|اجلس على حافة المسبح.", "Put your feet in the water.|ضع قدميك في الماء.", "Today we will learn a new skill.|اليوم سنتعلم مهارة جديدة.", "Listen carefully to the instructions.|استمع جيداً إلى التعليمات.", "Is everybody ready?|هل الجميع جاهزون؟", "That's the end of the lesson.|هذه نهاية الحصة.", "Get out and dry yourself with the towel.|اخرج وجفف نفسك بالمنشفة.", "Don't forget your bag and your goggles.|لا تنسَ حقيبتك ونظارتك."]},
{id:"beg",t:"Water confidence",s:"For beginners and kids",i:["Put your face in the water.|ضع وجهك في الماء.", "Blow bubbles like a fish.|انفخ فقاعات مثل السمكة.|kids", "Open your eyes under water.|افتح عينيك تحت الماء.", "Take a deep breath and go under.|خذ نفساً عميقاً وانزل تحت الماء.", "Hold your breath for five seconds.|احبس نفسك خمس ثوانٍ.", "Lie on your back and look up.|استلقِ على ظهرك وانظر للأعلى.", "Spread your arms and legs like a star.|افرد ذراعيك وساقيك مثل النجمة.|kids", "Hold the side and kick your legs.|أمسك الحافة واضرب بقدميك.", "Walk across the pool.|اعبر المسبح مشياً.", "You are floating by yourself!|أنت تطفو بمفردك!"]},
{id:"fb",t:"Freestyle and backstroke",s:"Correcting the movements",i:["Make your body long and straight.|اجعل جسمك طويلاً ومستقيماً.", "Keep your fingers together.|ابقِ أصابعك مضمومة.", "Enter the water with your fingertips first.|ادخل الماء بأطراف أصابعك أولاً.", "Pull all the way to your thigh.|اسحب حتى فخذك.", "Turn your head to the side to breathe.|أدر رأسك إلى الجانب لتتنفس.", "Kick with small, fast kicks.|اضرب بضربات صغيرة وسريعة.", "Keep your hips up near the surface.|أبقِ وركيك مرتفعين قرب السطح.", "On your back, look at the ceiling.|على ظهرك، انظر إلى السقف.", "Reach back with your little finger first.|مدّ ذراعك للخلف بالإصبع الصغير أولاً.", "Swim with long, smooth strokes.|اسبح بضربات طويلة وسلسة."]},
{id:"bf",t:"Breaststroke and butterfly",s:"Arm and leg movements",i:["Pull, breathe, kick, glide.|اسحب، تنفس، اضرب، انزلق.", "Turn your feet out like a frog.|أدر قدميك للخارج مثل الضفدع.", "Squeeze your legs together.|اضغط ساقيك معاً.", "Keep your elbows high.|أبقِ مرفقيك مرتفعين.", "Both arms move at the same time.|كلتا الذراعين تتحركان في الوقت نفسه.", "Move like a dolphin.|تحرك مثل الدلفين.|pro", "Kick twice for each arm pull.|اضرب مرتين مقابل كل سحبة ذراع.|pro", "Lift your chin to breathe forward.|ارفع ذقنك لتتنفس للأمام.", "Push your chest down.|اضغط صدرك للأسفل.|pro", "Finish with both hands on the wall.|أنهِ السباق بيديك الاثنتين على الحائط."]},
{id:"turns",t:"Starts, turns and finishes",s:"From the block to the wall",i:["Get ready on the block.|استعد على المنصة.", "Take your marks.|خذوا أماكنكم.|pro", "Bend your knees and jump.|اثنِ ركبتيك واقفز.", "Dive in with your arms above your head.|اغطس وذراعاك فوق رأسك.", "Streamline after you enter the water.|حافظ على وضع الانسيابية بعد دخول الماء.|pro", "Touch the wall with one hand.|المس الحائط بيد واحدة.", "Tuck your knees and turn around.|اضم ركبتيك واستدر.", "Push off strongly with your feet.|ادفع بقوة بقدميك.", "Don't stop at the wall.|لا تتوقف عند الحائط.", "Sprint to the finish!|انطلق بأقصى سرعة حتى النهاية!"]},
{id:"feed",t:"Feedback and corrections",s:"Tell the swimmer what to fix",i:["That was excellent!|كان ذلك ممتازاً!", "You are too fast. Slow down.|أنت سريع جداً. خفف السرعة.", "You are too slow. Speed up.|أنت بطيء جداً. أسرع.", "Your head is too high.|رأسك مرتفع جداً.", "Your arms are crossing in front.|ذراعاك تتقاطعان في الأمام.", "Your legs are dropping.|ساقاك تهبطان.", "Don't lift your head.|لا ترفع رأسك.", "You are kicking too much.|أنت تضرب بالقدمين أكثر من اللازم.", "Use more power from your legs.|استخدم قوة أكبر من ساقيك.", "That is exactly right.|هذا صحيح تماماً."]},
{id:"cls",t:"Managing the class",s:"Order, turns and teamwork",i:["Quiet, please.|هدوء من فضلكم.", "Listen to my whistle.|استمعوا إلى صافرتي.", "Wait for your turn.|انتظر دورك.", "Share the kickboard.|شاركوا لوح الطفو.|kids", "Don't push your friend.|لا تدفع صديقك.|kids", "Stay behind the lane rope.|ابقَ خلف حبل الحارة.", "Swim in a line, one after another.|اسبحوا في صف واحد، واحداً تلو الآخر.", "Keep a gap between you and the swimmer in front.|اترك مسافة بينك وبين السباح الذي أمامك.", "Raise your hand if you have a question.|ارفع يدك إن كان لديك سؤال.", "Everyone gets a turn.|الجميع سيحصل على دوره.|kids"]},
{id:"rules",t:"Pool rules",s:"What is allowed and what is not",i:["Shower before you get in the pool.|استحم قبل دخول المسبح.", "Don't jump in the shallow end.|لا تقفز في الجزء الضحل.", "No diving here.|ممنوع الغطس هنا.", "Don't chew gum in the water.|لا تمضغ العلكة في الماء.", "Don't bring food to the pool deck.|لا تُحضر طعاماً إلى حافة المسبح.", "Wear your cap at all times.|ارتدِ القبعة طوال الوقت.", "Always listen to the lifeguard.|استمع دائماً إلى المنقذ.", "The pool closes at nine o'clock.|يُغلق المسبح الساعة التاسعة.", "Wait until the coach arrives.|انتظر حتى يصل المدرب.", "Don't go in without an adult.|لا تدخل بدون شخص بالغ.|kids"]},
{id:"book",t:"Bookings and prices",s:"Schedule, cost and payment",i:["Would you like to book a trial lesson?|هل ترغب في حجز حصة تجريبية؟", "The first lesson is free.|الحصة الأولى مجانية.", "We have private and group lessons.|لدينا حصص خاصة وحصص جماعية.", "How many lessons a week do you want?|كم حصة في الأسبوع تريد؟", "A private lesson costs two hundred pounds.|الحصة الخاصة تكلف مئتي جنيه.|adults", "There is a discount for brothers and sisters.|هناك خصم للإخوة والأخوات.", "Can I change the time of the lesson?|هل يمكنني تغيير موعد الحصة؟", "Please tell me a day before if you can't come.|من فضلك أخبرني قبلها بيوم إن لم تستطع الحضور.", "We will make up the missed lesson.|سنعوّض الحصة الفائتة.", "You can pay in cash or by transfer.|يمكنك الدفع نقداً أو بالتحويل.|adults"]},
{id:"emerg",t:"Emergencies and first aid",s:"Fast words in danger",i:["Help! Call the lifeguard!|النجدة! نادِ المنقذ!", "Get out of the water now.|اخرج من الماء فوراً.", "Don't panic.|لا تفزع.", "Breathe slowly.|تنفس ببطء.", "Sit down and rest.|اجلس واسترح.", "He swallowed some water.|ابتلع بعض الماء.", "She hit her head.|ضربت رأسها.", "Put ice on it.|ضع عليها ثلجاً.", "Call an ambulance.|اتصل بالإسعاف.", "Call his parents.|اتصل بوالديه."]},
{id:"gr",t:"Greetings and goodbyes",s:"The first and last thing you say",v:2,i:["Hello!|مرحباً!", "Hi, how are you?|أهلاً، كيف حالك؟", "Good morning.|صباح الخير.", "Good afternoon.|طاب يومك بعد الظهر.", "Good evening.|مساء الخير.", "Good night.|تصبح على خير.", "Long time no see!|لم أرك منذ زمن!", "See you later.|أراك لاحقاً.", "See you tomorrow.|أراك غداً.", "Goodbye, take care.|مع السلامة، اعتنِ بنفسك."]},
{id:"pol",t:"Polite words",s:"Please, thank you, sorry",v:2,i:["Please.|من فضلك.", "Thank you very much.|شكراً جزيلاً.", "You're welcome.|عفواً.", "Excuse me.|عفواً (لجذب الانتباه).", "I'm sorry.|أنا آسف.", "Sorry to bother you.|آسف على الإزعاج.", "No problem.|لا مشكلة.", "Never mind.|لا يهم.", "After you.|تفضل أنت أولاً.", "Bless you!|يرحمك الله! (عند العطس)"]},
{id:"intro",t:"Introducing yourself",s:"Name, country and job",v:2,i:["My name is Ahmed.|اسمي أحمد.", "What's your name?|ما اسمك؟", "Nice to meet you.|تشرفت بمعرفتك.", "Where are you from?|من أين أنت؟", "I'm from Egypt.|أنا من مصر.", "I live in Giza.|أنا أعيش في الجيزة.", "How old are you?|كم عمرك؟", "I'm twenty years old.|عمري عشرون سنة.", "What do you do?|ماذا تعمل؟", "I'm a swimming coach.|أنا مدرب سباحة."]},
{id:"small",t:"Small talk",s:"Light questions with anyone",v:2,i:["How are you doing?|كيف حالك؟", "I'm fine, thanks. And you?|أنا بخير شكراً، وأنت؟", "Not bad.|لا بأس.", "What's up?|ما الأخبار؟", "How was your day?|كيف كان يومك؟", "The weather is nice today.|الطقس جميل اليوم.", "It's very hot today.|الجو حار جداً اليوم.", "Do you have any plans for the weekend?|هل لديك خطط لعطلة نهاية الأسبوع؟", "What do you like to do in your free time?|ماذا تحب أن تفعل في وقت فراغك؟", "Have a nice weekend!|عطلة أسبوع سعيدة!"]},
